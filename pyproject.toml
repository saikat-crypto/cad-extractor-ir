[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-extractor-ir"
version = "1.0.0"
authors = [
  { name="Saikat Dutta Chowdhury" },
]
description = "High-performance CAD/DWG parser and Intermediate Representation (IR) extraction engine. Part of the La Vinci ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cad", "dwg", "parser", "engineering", "bim", "intermediate-representation", "aws-lambda", "lavinci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ezdxf>=1.4.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cloud = [
    "boto3>=1.34.0",
]

[project.scripts]
cad-extractor = "cad_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
